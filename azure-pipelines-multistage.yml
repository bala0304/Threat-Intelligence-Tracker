

trigger: none
pr: none

stages:
- stage: Build
  displayName: Build Docker Image
  jobs:
  - job: BuildJob
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: Docker@1
      displayName: Build an image
      inputs:
        containerregistrytype: 'Azure Container Registry'
        azureSubscriptionEndpoint: 'bala'
        azureContainerRegistry: '{"loginServer":"skillitacr20261109.azurecr.io","id":"/subscriptions/64c1a95b-eafc-4376-936a-eb697b18a0c7/resourceGroups/RG-ACR/providers/Microsoft.ContainerRegistry/registries/skillitacr20261109"}'
        dockerFile: 'Dockerfile'
        imageName: 'bala-python-yaml:$(Build.BuildId)'
        command: 'Build an image'
        additionalImageTags: '$(Build.BuildId)'

    - script: |
        docker save skillitacr20261109.azurecr.io/bala-python-yaml:$(Build.BuildId) -o $(Build.ArtifactStagingDirectory)/tracker-image.tar
      displayName: Save Docker Image

    - task: PublishPipelineArtifact@1
      displayName: Publish Docker Image Artifact
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)'
        artifact: 'docker-image'

- stage: Push
  displayName: Push Docker Image
  dependsOn: Build
  jobs:
  - job: PushJob
    pool:
      vmImage: ubuntu-latest
    steps:
    - task: DownloadPipelineArtifact@2
      displayName: Download Docker Image Artifact
      inputs:
        buildType: 'current'
        artifactName: 'docker-image'
        targetPath: '$(Pipeline.Workspace)/docker-image'

    - script: |
        docker load -i $(Pipeline.Workspace)/docker-image/tracker-image.tar
      displayName: Load Docker Image

    - task: Docker@1
      displayName: Push an image
      inputs:
        containerregistrytype: 'Azure Container Registry'
        azureSubscriptionEndpoint: 'bala'
        azureContainerRegistry: '{"loginServer":"skillitacr20261109.azurecr.io","id":"/subscriptions/64c1a95b-eafc-4376-936a-eb697b18a0c7/resourceGroups/RG-ACR/providers/Microsoft.ContainerRegistry/registries/skillitacr20261109"}'
        dockerFile: 'Dockerfile'
        imageName: 'bala-python-yaml:$(Build.BuildId)'
        command: 'Push an image'
        additionalImageTags: '$(Build.BuildId)'


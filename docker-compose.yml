services:
  postgres:
    image: postgres:16-alpine
    container_name: threat-intel-postgres
    environment:
      POSTGRES_DB: threat_intel_db
      POSTGRES_USER: threat_intel_user
      POSTGRES_PASSWORD: threat_intel_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threat_intel_user -d threat_intel_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
